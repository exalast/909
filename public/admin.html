<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — 909</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#060912; --navy:#0e1526; --ice:#a9d8ff; --ice-dim:#5f7fa8;
    --frost:#f2f7ff; --violet:#7c6cff; --line:rgba(169,216,255,0.14);
    --danger:#ff6b6b; --ok:#6bffb0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--navy-deep); color:var(--frost);
    font-family:'Inter',system-ui,sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .brand{
    font-family:'Anton',sans-serif; font-size:20px; margin-bottom:24px;
    display:flex; align-items:baseline; gap:8px;
  }
  .brand span{color:var(--ice);}

  .card{
    background:var(--navy); border:1px solid var(--line); border-radius:16px;
    padding:36px; width:100%; max-width:440px;
  }
  .card.wide{max-width:600px;}
  h1{font-size:20px; margin:0 0 6px;}
  p.hint{color:var(--ice-dim); font-size:13px; margin:0 0 24px;}

  label{display:block; font-size:13px; font-weight:600; color:var(--ice); margin:18px 0 8px;}
  label:first-of-type{margin-top:0;}
  input[type=password], input[type=text], input[type=url], textarea{
    width:100%; background:#0b1120; border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; color:var(--frost); font-family:inherit; font-size:14px;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, textarea:focus{outline:none; border-color:var(--ice-dim);}

  .checkbox-row{display:flex; align-items:center; gap:10px; margin:18px 0;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0; font-size:14px; color:var(--frost);}

  .file-drop{
    border:1px dashed var(--line); border-radius:10px; padding:18px;
    text-align:center; font-size:13px; color:var(--ice-dim); cursor:pointer;
    margin-top:8px;
  }
  .file-drop:hover{border-color:var(--ice-dim);}
  .preview{
    margin-top:12px; width:100%; height:140px; border-radius:10px;
    background-size:cover; background-position:center; border:1px solid var(--line);
    display:none;
  }
  .preview.active{display:block;}

  button{
    width:100%; background:var(--violet); color:#fff; border:none; border-radius:10px;
    padding:14px; font-weight:600; font-size:15px; cursor:pointer; margin-top:24px;
    transition:background .2s;
  }
  button:hover{background:#6a5aff;}
  button.secondary{
    background:transparent; border:1px solid var(--line); color:var(--frost); margin-top:10px;
  }
  button.secondary:hover{background:rgba(169,216,255,0.06);}
  button:disabled{opacity:.6; cursor:not-allowed;}

  .msg{font-size:13px; margin-top:14px; min-height:18px;}
  .msg.error{color:var(--danger);}
  .msg.ok{color:var(--ok);}

  .row-actions{display:flex; gap:10px;}
  .row-actions button{margin-top:24px;}

  #settings-view{display:none;}
</style>
</head>
<body>

<div>
  <div class="brand">909<span>.gg</span> — admin</div>

  <div class="card" id="login-view">
    <h1>Iniciar sesión</h1>
    <p class="hint">Ingresa la contraseña de administrador para editar el sitio.</p>
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autofocus>
    <button id="btn-login">Entrar</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div class="card wide" id="settings-view">
    <h1>Configuración del sitio</h1>
    <p class="hint">Los cambios se guardan en la base de datos y se ven al instante para todos los visitantes.</p>

    <label for="hero-title">Título principal</label>
    <input type="text" id="hero-title" maxlength="40">

    <label for="hero-subtitle">Subtítulo</label>
    <textarea id="hero-subtitle" maxlength="220"></textarea>

    <label for="invite-link">Link de invitación de Discord</label>
    <input type="url" id="invite-link" placeholder="https://discord.gg/...">

    <label>Imagen de fondo</label>
    <div class="file-drop" id="file-drop">Haz clic para elegir una imagen (JPG o PNG, ideal menos de 3 MB)</div>
    <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" style="display:none;">
    <div class="preview" id="preview"></div>
    <button type="button" class="secondary" id="btn-remove-bg">Quitar imagen de fondo</button>

    <div class="checkbox-row">
      <input type="checkbox" id="snow-enabled" checked>
      <label for="snow-enabled">Mostrar efecto de nieve</label>
    </div>

    <div class="row-actions">
      <button id="btn-save">Guardar cambios</button>
      <button class="secondary" id="btn-logout" type="button">Cerrar sesión</button>
    </div>
    <div class="msg" id="save-msg"></div>
  </div>
</div>

<script>
  const loginView = document.getElementById('login-view');
  const settingsView = document.getElementById('settings-view');
  const loginMsg = document.getElementById('login-msg');
  const saveMsg = document.getElementById('save-msg');

  let pendingBackgroundImage = undefined; // undefined = sin cambio, '' = quitar, dataURL = nueva

  async function checkSession(){
    const res = await fetch('/api/admin/check');
    if (res.ok) {
      loginView.style.display = 'none';
      settingsView.style.display = 'block';
      loadSettings();
    }
  }

  async function loadSettings(){
    const res = await fetch('/api/settings');
    const cfg = await res.json();
    document.getElementById('hero-title').value = cfg.heroTitle || '';
    document.getElementById('hero-subtitle').value = cfg.heroSubtitle || '';
    document.getElementById('invite-link').value = cfg.inviteLink || '';
    document.getElementById('snow-enabled').checked = cfg.snowEnabled !== false;
    const preview = document.getElementById('preview');
    if (cfg.backgroundImage) {
      preview.style.backgroundImage = `url("${cfg.backgroundImage}")`;
      preview.classList.add('active');
    }
  }

  document.getElementById('btn-login').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    loginMsg.textContent = '';
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (data.ok) {
      loginView.style.display = 'none';
      settingsView.style.display = 'block';
      loadSettings();
    } else {
      loginMsg.textContent = data.error || 'Error al iniciar sesión';
      loginMsg.className = 'msg error';
    }
  });

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });

  document.getElementById('file-drop').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      saveMsg.textContent = 'La imagen es demasiado grande (máx. 5 MB).';
      saveMsg.className = 'msg error';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingBackgroundImage = reader.result; // data:image/...;base64,...
      const preview = document.getElementById('preview');
      preview.style.backgroundImage = `url("${reader.result}")`;
      preview.classList.add('active');
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btn-remove-bg').addEventListener('click', () => {
    pendingBackgroundImage = '';
    const preview = document.getElementById('preview');
    preview.style.backgroundImage = '';
    preview.classList.remove('active');
  });

  document.getElementById('btn-save').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    saveMsg.textContent = 'Guardando...';
    saveMsg.className = 'msg';

    const payload = {
      heroTitle: document.getElementById('hero-title').value,
      heroSubtitle: document.getElementById('hero-subtitle').value,
      inviteLink: document.getElementById('invite-link').value,
      snowEnabled: document.getElementById('snow-enabled').checked,
    };
    if (pendingBackgroundImage !== undefined) {
      payload.backgroundImage = pendingBackgroundImage;
    }

    const res = await fetch('/api/admin/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    btn.disabled = false;
    if (data.ok) {
      saveMsg.textContent = 'Cambios guardados. Ya se ven en el sitio.';
      saveMsg.className = 'msg ok';
      pendingBackgroundImage = undefined;
    } else {
      saveMsg.textContent = data.error || 'Error al guardar';
      saveMsg.className = 'msg error';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    settingsView.style.display = 'none';
    loginView.style.display = 'block';
    document.getElementById('password').value = '';
  });

  checkSession();
</script>

</body>
</html>
